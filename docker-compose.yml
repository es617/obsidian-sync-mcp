# Create a .env file to override defaults:
#   COUCHDB_PASSWORD=<strong-password>
#   VAULT_NAME=MyVault
#   MCP_AUTH_TOKEN=<password-for-mcp>   (required)
#   LIVESYNC_USER=livesync          (optional, recommended)
#   LIVESYNC_PASSWORD=<password>    (optional, recommended)

services:
  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"  # Exposed for Obsidian LiveSync plugin to connect
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./deploy/mcp-with-db/couchdb-init.ini:/opt/couchdb/etc/local.d/livesync.ini

  # One-shot: the MCP server never creates databases (it fails fast if the
  # database is missing), so create it here before the server starts. Waits for
  # CouchDB, creates the database if absent, then exits.
  db-init:
    image: couchdb:3
    depends_on:
      - couchdb
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian}
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        AUTH="$$COUCHDB_USER:$$COUCHDB_PASSWORD"
        echo "Waiting for CouchDB..."
        until curl -sf -u "$$AUTH" http://couchdb:5984/_up >/dev/null 2>&1; do sleep 1; done
        code=$$(curl -s -o /dev/null -w '%{http_code}' -u "$$AUTH" "http://couchdb:5984/$$COUCHDB_DATABASE")
        if [ "$$code" = "200" ]; then
          echo "Database $$COUCHDB_DATABASE already exists."
        else
          echo "Creating database $$COUCHDB_DATABASE..."
          curl -sf -u "$$AUTH" -X PUT "http://couchdb:5984/$$COUCHDB_DATABASE"
          echo "Created."
        fi

  mcp:
    image: ghcr.io/es617/obsidian-sync-mcp:latest
    ports:
      # Localhost only. For access from other machines, put an HTTPS tunnel or
      # reverse proxy in front and set BASE_URL to its public URL (see README).
      - "127.0.0.1:8787:8787"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian}
      VAULT_NAME: ${VAULT_NAME:-MyVault}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      BASE_URL: ${BASE_URL:-http://localhost:8787}
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  couchdb_data:
