# Create a .env file to override defaults:
#   COUCHDB_PASSWORD=<strong-password>
#   VAULT_NAME=MyVault
#   MCP_AUTH_TOKEN=<password-for-mcp>   (required)
#   LIVESYNC_USER=livesync          (optional, recommended)
#   LIVESYNC_PASSWORD=<password>    (optional, recommended)

services:
  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"  # Exposed for Obsidian LiveSync plugin to connect
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./deploy/mcp-with-db/couchdb-init.ini:/opt/couchdb/etc/local.d/livesync.ini
    healthcheck:
      # require_valid_user is on (couchdb-init.ini), so even /_up needs credentials.
      test: ["CMD-SHELL", "curl -sf -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 12

  mcp:
    image: ghcr.io/es617/obsidian-sync-mcp:latest
    ports:
      # Localhost only. For access from other machines, put an HTTPS tunnel or
      # reverse proxy in front and set BASE_URL to its public URL (see README).
      - "127.0.0.1:8787:8787"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian}
      VAULT_NAME: ${VAULT_NAME:-MyVault}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      BASE_URL: ${BASE_URL:-http://localhost:8787}
    depends_on:
      couchdb:
        condition: service_healthy  # the server exits if CouchDB isn't accepting connections yet

volumes:
  couchdb_data:
